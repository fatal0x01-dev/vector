# Port-based: Elasticsearch's HTTP API (9200) and transport protocol
# (9300) are commonly left without authentication (no security plugin
# configured) and nmap -sV often just calls 9200 "http" without
# identifying the product. http-title/http-headers against 9200 is
# enough to show the Elasticsearch banner/cluster name in the raw
# response, which confirms exposure; a full index/cluster dump is
# deliberately out of scope for this module (see README "Not yet
# implemented" -- that's an exploiter-stage action, not a recon one).
module: elasticsearch
triggers:
  port:
    - 9200
    - 9300
tools:
  - nse-probe
nse_scripts:
  - http-title
  - http-headers
produces:
  - finding
